<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo Disc Vol. 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg1: #12082e; --bg2: #2a0e5a; --ink: #f4f0ff; --dim: #9a8cc8; --hot: #ffe14a; --sel: #ff5ab0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg1); color: var(--ink); font-family: 'Press Start 2P', 'Courier New', monospace; }
  body { background: radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg1) 70%); overflow-x: hidden; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }
  main { max-width: 760px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; }
  header { display: flex; align-items: center; gap: 22px; margin-bottom: 28px; }
  .disc { width: 112px; height: 112px; flex: none; border-radius: 50%; animation: spin 4s linear infinite;
    background: radial-gradient(circle, var(--bg1) 0 12%, #c8c8d8 12% 14%, transparent 14%),
      conic-gradient(from 0deg, #ff5ab0, #ffe14a, #4ad05a, #3a96ff, #b05aff, #ff5ab0); box-shadow: 0 0 0 4px #fff3, 0 0 30px #ff5ab066; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .disc { animation: none; } }
  h1 { font-size: clamp(18px, 5vw, 30px); line-height: 1.3; margin: 0; color: var(--hot); text-shadow: 3px 3px 0 #000; }
  .sub { font-size: 10px; color: var(--dim); margin-top: 10px; line-height: 1.8; }
  h2 { font-size: 12px; color: var(--dim); margin: 26px 0 12px; letter-spacing: 2px; }
  .list { display: grid; gap: 12px; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px; border: 3px solid #fff3; background: #0008; color: var(--ink); text-decoration: none; }
  .item .tag { flex: none; font-size: 9px; padding: 6px 7px; background: #fff2; color: var(--hot); }
  .item .name { font-size: 13px; line-height: 1.5; }
  .item .desc { font-size: 9px; color: var(--dim); line-height: 1.8; margin-top: 6px; font-family: 'Press Start 2P', monospace; }
  .item.sel, .item:focus-visible { border-color: var(--sel); background: #ff5ab022; outline: none; }
  .item.sel .name::before { content: '▶ '; color: var(--sel); }
  .controls { margin-top: 30px; font-size: 9px; color: var(--dim); line-height: 2; }
  .blink { animation: blink 1s steps(2) infinite; color: var(--hot); }
  @keyframes blink { 50% { opacity: 0; } }
  dialog { border: 3px solid var(--sel); background: #000; padding: 0; max-width: min(92vw, 420px); }
  dialog video { display: block; width: 100%; max-height: 80dvh; background: #000; }
  dialog button { font: inherit; font-size: 10px; width: 100%; padding: 12px; background: var(--sel); color: #000; border: 0; cursor: pointer; }
  dialog::backdrop { background: #000c; }
</style></head>
<body><main>
  <header>
    <div class="disc" role="img" aria-label="Spinning demo disc"></div>
    <div><h1>DEMO DISC<br>VOL. 1</h1><div class="sub">2 PLAYABLE DEMOS · 2 TRAILERS<br><span class="blink">PRESS START</span></div></div>
  </header>
  <h2>— PLAYABLE DEMOS —</h2>
  <div class="list" id="demos"></div>
  <h2>— TRAILERS —</h2>
  <div class="list" id="trailers"></div>
  <div class="controls">↑ ↓ SELECT · ENTER / A START · ESC / B BACK<br>TOUCH: TAP TO START</div>
</main>
<dialog id="player"><video id="vid" controls playsinline></video><button id="close">◀ BACK TO DISC</button></dialog>
<script>
(function () {
  'use strict';
  const entries = [
    { list: 'demos', tag: 'PLAY', name: 'ONLY 1% CAN SAVE HIM', desc: 'Pull the pins. Save the knight. 3 levels.', href: 'games/only1/index.html' },
    { list: 'demos', tag: 'PLAY', name: 'STICK SWARM 3D', desc: 'Pick the gates. Grow the swarm. Beat the giant.', href: 'games/stickswarm/index.html' },
    { list: 'trailers', tag: 'VIDEO', name: 'ONLY 1% CAN SAVE HIM', desc: 'Trailer · 0:41', href: 'trailers/only1.mp4', video: true },
    { list: 'trailers', tag: 'VIDEO', name: 'STICK SWARM 3D', desc: 'Trailer · 0:25', href: 'trailers/stickswarm.mp4', video: true },
  ];
  const els = entries.map((e, i) => {
    const a = document.createElement('a'); a.className = 'item'; a.href = e.href; a.tabIndex = 0;
    a.innerHTML = `<span class="tag">${e.tag}</span><span><div class="name">${e.name}</div><div class="desc">${e.desc}</div></span>`;
    a.addEventListener('click', ev => { if (e.video) { ev.preventDefault(); play(e.href); } });
    a.addEventListener('mouseenter', () => select(i));
    document.getElementById(e.list).appendChild(a); return a;
  });
  let sel = 0;
  function select(i) { sel = (i + els.length) % els.length; els.forEach((el, j) => el.classList.toggle('sel', j === sel)); beep(660); }
  function start() { const e = entries[sel]; beep(990); if (e.video) play(e.href); else location.href = e.href; }
  const dlg = document.getElementById('player'), vid = document.getElementById('vid');
  function play(src) { vid.src = src; dlg.showModal(); vid.play().catch(() => {}); }
  function closeVid() { vid.pause(); dlg.close(); }
  document.getElementById('close').onclick = closeVid;
  dlg.addEventListener('close', () => vid.pause());
  // menu owns its own input: keys act only while the video dialog is closed
  window.addEventListener('keydown', e => {
    if (dlg.open) { if (e.key === 'Escape' || e.key === 'Backspace') closeVid(); return; }
    if (e.key === 'ArrowDown') { select(sel + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { select(sel - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { start(); e.preventDefault(); }
  });
  // gamepad: poll every frame; D-pad and stick (debounced) both navigate
  let prev = {}, stickT = 0;
  (function poll(t) {
    for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) {
      if (!p) continue;
      const press = (i, fn) => { const d = !!(p.buttons[i] && p.buttons[i].pressed); if (d && !prev[i]) fn(); prev[i] = d; };
      if (dlg.open) { press(1, closeVid); continue; }
      press(12, () => select(sel - 1)); press(13, () => select(sel + 1)); press(0, start); press(9, start);
      const ay = p.axes[1] || 0; if (Math.abs(ay) > .6 && t - stickT > 220) { select(sel + (ay > 0 ? 1 : -1)); stickT = t; }
    }
    requestAnimationFrame(poll);
  })(0);
  // tiny menu blip; audio never blocks anything
  let ac = null;
  function beep(f) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume().catch(() => {}); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(.05, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .06); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .07); } catch (_) {} }
  select(0);
  window.__menu = { entries };
})();
</script>
</body></html>
