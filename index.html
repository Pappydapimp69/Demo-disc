<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo Disc Vol. 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0620; --ink: #f4f0ff; --dim: #9a8cc8; --hot: #ffe14a; --sel: #ff5ab0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Press Start 2P', 'Courier New', monospace; overflow: hidden; overscroll-behavior: none; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px); }

  /* ---------- carousel: one tile per game, swipe left/right, snap to one ---------- */
  #rail { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #rail::-webkit-scrollbar { display: none; }
  .tile { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; position: relative; display: grid; place-items: center; }
  /* the ad gets its own box; the title and play button sit below it, never on top of it */
  :root { --toph: 44px; --barh: 182px; }
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding-top: var(--toph); color: inherit; text-decoration: none; cursor: pointer; }
  .frame { position: relative; flex: none; height: min(calc(100dvh - var(--toph) - var(--barh)), calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; max-width: 100vw; background: #000; overflow: hidden; }
  .frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bar { flex: none; width: 100%; max-width: 560px; height: var(--barh); padding: 14px 16px max(26px, calc(env(safe-area-inset-bottom) + 18px)); text-align: center; pointer-events: none; }
  .bar .name { font-size: clamp(12px, 3.6vw, 16px); color: var(--hot); text-shadow: 2px 2px 0 #000; line-height: 1.4; }
  .bar .desc { font-size: 9px; color: var(--ink); margin: 10px 0 14px; line-height: 1.7; }
  .bar .play { display: inline-block; font-size: 11px; padding: 12px 18px; background: var(--sel); color: #000; box-shadow: 4px 4px 0 #000; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .bar .swipe { font-size: 9px; color: var(--dim); margin-top: 16px; }
  .bar .swipe b { display: inline-block; color: var(--hot); font-weight: normal; animation: nudgeL 1.2s ease-in-out infinite; }
  .bar .swipe b + b { animation-name: nudgeR; }
  @keyframes nudgeL { 50% { transform: translateX(-5px); } }
  @keyframes nudgeR { 50% { transform: translateX(5px); } }
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; z-index: 10; pointer-events: none; }
  .top .title { font-size: 10px; color: var(--hot); text-shadow: 2px 2px 0 #000; }
  .top button { pointer-events: auto; font: inherit; font-size: 10px; padding: 8px 10px; background: #000a; color: var(--ink); border: 2px solid #fff4; cursor: pointer; }
  .dots { position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; z-index: 10; pointer-events: none; }
  .dots i { width: 8px; height: 8px; background: #fff4; }
  .dots i.on { background: var(--sel); }
  .arrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 10; font: inherit; font-size: 18px; width: 44px; height: 64px; background: #0008; color: var(--ink); border: 2px solid #fff3; cursor: pointer; }
  .arrow.l { left: 8px; } .arrow.r { right: 8px; }
  @media (hover: none) { .arrow { display: none; } }

  /* ---------- splash: ZANEPAUL STUDIO ... STUPIDO ---------- */
  #play { position: fixed; inset: 0; z-index: 30; width: 100%; height: 100%; border: 0; background: #000; display: none; }
  #play.on { display: block; }
  #splash { position: fixed; inset: 0; z-index: 40; background: #000; display: grid; place-items: center; cursor: pointer; transition: opacity .5s; }
  #splash.gone { opacity: 0; }
  .logo { text-align: center; }
  .logo .who { font-size: clamp(16px, 6vw, 34px); color: var(--ink); letter-spacing: 4px; opacity: 0; animation: fadeUp .6s .2s forwards; }
  .word { position: relative; display: inline-flex; margin-top: 22px; height: 1.4em; font-size: clamp(22px, 9vw, 52px); color: var(--hot); text-shadow: 4px 4px 0 #c0307a; }
  .word span { display: inline-block; width: 1em; text-align: center; transition: transform .25s cubic-bezier(.3,1.6,.5,1); opacity: 0; animation: fadeUp .4s forwards; }
  .word .p { position: absolute; left: 0; top: 0; opacity: 1; animation: none; transform: translateY(-120vh); color: var(--sel); text-shadow: 4px 4px 0 #6a1a8a; }
  .word.bump { animation: bump .25s; }
  @keyframes bump { 30% { transform: translateY(6px) rotate(-2deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .tm { font-size: 9px; color: var(--dim); margin-top: 26px; opacity: 0; transition: opacity .4s; }
  .tap { font-size: 10px; color: var(--hot); margin-top: 34px; opacity: 0; }
  .tap.on { animation: blink 1s steps(2) infinite; opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bar .play, .tap.on, .bar .swipe b { animation: none; } }
</style></head>
<body>
<div id="rail"></div>
<iframe id="play" title="Game"></iframe>
<div class="top"><span class="title">DEMO DISC VOL.1</span><button id="snd" aria-label="Toggle sound">🔇 SOUND</button></div>
<button class="arrow l" id="prev" aria-label="Previous game">◀</button>
<button class="arrow r" id="next" aria-label="Next game">▶</button>
<div class="dots" id="dots"></div>

<div id="splash" role="button" aria-label="Tap to start">
  <div class="logo">
    <div class="who">ZANEPAUL</div>
    <div class="word" id="word"></div>
    <div class="tm" id="tm">EST. WHENEVER · NO REFUNDS</div>
    <div class="tap" id="tap">TAP TO START</div>
  </div>
</div>

<script src="shared/stats.js"></script>
<script>
(function () {
  'use strict';
  const games = [
    { name: 'ONLY 1% CAN SAVE HIM', desc: 'Pull the pins. Save the knight.<br>Lose the gold. 3 levels.', href: 'games/only1/index.html', trailer: 'trailers/only1.mp4' },
    { name: 'STICK SWARM 3D', desc: 'Pick the gates. Grow the swarm.<br>Beat the giant. 8 levels.', href: 'games/stickswarm/index.html', trailer: 'trailers/stickswarm.mp4' },
    { name: 'PARKING JAM', desc: 'Get Gary out.<br>3 levels.', href: 'games/parkingjam/index.html', trailer: 'trailers/parkingjam.mp4' },
    { name: 'HAIR SALON ASMR', desc: 'Just a trim.<br>5 levels.', href: 'games/salon/index.html', trailer: 'trailers/salon.mp4' },
    { name: 'BLOCKING', desc: 'Every seat sees every actor.<br>4 scenes.', href: 'games/blocking/index.html', trailer: 'trailers/blocking.mp4' },
    { name: "THE BOSS'S BAD DAY", desc: 'Can you beat him?<br>3 levels.', href: 'games/boss/index.html', trailer: 'trailers/boss.mp4' },
    { name: 'THE LAST NOTE', desc: 'Only 1% can play this.<br>10 levels.', href: 'games/lastnote/index.html', trailer: 'trailers/lastnote.mp4' },
    { name: 'THIRSTY', desc: 'Draw to save him.<br>4 levels.', href: 'games/thirsty/index.html', trailer: 'trailers/thirsty.mp4' },
    { name: 'SOAP OPERA SOLITAIRE', desc: 'Every card has a secret.<br>3 seasons.', href: 'games/soap/index.html', trailer: 'trailers/soap.mp4' },
    { name: 'THE INTERN', desc: 'Day 1 in IT.<br>3 days.', href: 'games/intern/index.html', trailer: 'trailers/intern.mp4' },
    { name: 'STONEWAKE', desc: 'It was never a mountain.<br>A pixel RPG.', href: 'games/stonewake/index.html', trailer: 'trailers/stonewake.mp4' },
    { name: 'VEER', desc: 'Draw the path. Save his friend.<br>7 levels.', href: 'games/veer/index.html', trailer: 'trailers/veer.mp4' },
    { name: 'EMBERS', desc: 'Build the biggest fire!<br>5 nights.', href: 'games/embers/index.html', trailer: 'trailers/embers.mp4' },
    { name: 'GOING UP', desc: 'Stack the tallest tower!<br>5 days.', href: 'games/goingup/index.html', trailer: 'trailers/goingup.mp4' },
    { name: 'FARO', desc: 'Find the ace. Win big.<br>5 hands.', href: 'games/faro/index.html', trailer: 'trailers/faro.mp4' },
    { name: 'IQ TEST 2026', desc: 'Only geniuses remember all 10.<br>A week of days.', href: 'games/iqtest/index.html', trailer: 'trailers/iqtest.mp4' },
    { name: 'POP IT!', desc: 'So satisfying.<br>30-second rounds.', href: 'games/popit/index.html', trailer: 'trailers/popit.mp4' },
    { name: 'LOBBY', desc: '10,000,000 players online.<br>5 shifts.', href: 'games/lobby/index.html', trailer: 'trailers/lobby.mp4' },
  ];

  // ---------- audio blips (never block) ----------
  let ac = null, sound = true; // sound is on unless the viewer turns it off
  function beep(f, d = .07, type = 'square', vol = .05) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d + .01);
    } catch (_) {}
  }

  // ---------- tiles ----------
  const rail = document.getElementById('rail'), dots = document.getElementById('dots');
  const tiles = games.map((g, i) => {
    const t = document.createElement('section'); t.className = 'tile'; t.dataset.i = i;
    t.innerHTML = `<a class="card" href="${g.href}" aria-label="Play ${g.name}">
      <div class="frame"><video src="${g.trailer}" poster="${g.trailer.replace('.mp4', '.jpg')}" muted loop playsinline preload="metadata"></video></div>
      <div class="bar"><div class="name">${g.name}</div><div class="desc">${g.desc}</div><span class="play">▶ TAP TO PLAY</span>
      <div class="swipe"><b>◀</b> SWIPE FOR MORE ADS <b>▶</b></div></div></a>`;
    t.querySelector('a').addEventListener('click', ev => { ev.preventDefault(); launch(i); });
    rail.appendChild(t); dots.appendChild(document.createElement('i')); return t;
  });
  const vids = tiles.map(t => t.querySelector('video'));
  let cur = 0, started = false, playing = -1;

  // ---------- stats: which ads get watched, which get played, and for how long ----------
  const slug = i => games[i].href.split('/')[1];
  const AD_CUTS = [[2, null], [5, '2-5s'], [15, '5-15s'], [Infinity, '15s+']];
  const GAME_CUTS = [[10, 'under-10s'], [60, '10-60s'], [300, '1-5min'], [Infinity, '5min+']];
  let adI = -1, adT0 = 0, adLooped = false, gameI = -1, gameT0 = 0;
  function adEnd(played) {   // a swipe past in under 2 s is a skip; a tap to play always counts as a view
    if (adI < 0) return;
    const s = (performance.now() - adT0) / 1000, b = adLooped ? 'full' : Stats.bucket(s, AD_CUTS) || (played ? '0-2s' : 'skipped');
    Stats.event(`ad/${slug(adI)}/${b}`, `${games[adI].name} ad: ${b}`);
    adI = -1;
  }
  function adStart(i) { adEnd(); adI = i; adT0 = performance.now(); adLooped = false; }
  function gameEnd() {
    if (gameI < 0) return;
    const b = Stats.bucket((performance.now() - gameT0) / 1000, GAME_CUTS);
    Stats.event(`time/${slug(gameI)}/${b}`, `${games[gameI].name}: played ${b}`); gameI = -1;
  }
  vids.forEach((v, i) => {
    let last = 0;
    v.addEventListener('timeupdate', () => { if (i === adI && v.currentTime + .5 < last) adLooped = true; last = v.currentTime; });
  });
  // the whole visit, once, when the page goes away (mobile browsers often only say "hidden")
  const VISIT_CUTS = [[30, 'under-30s'], [120, '30s-2min'], [600, '2-10min'], [Infinity, '10min+']], playedSet = new Set();
  let visitSent = false;
  function visitEnd() {
    if (visitSent || !started) return; visitSent = true;
    Stats.event(`visit/${Stats.bucket(performance.now() / 1000, VISIT_CUTS)}`, 'visit length');
    Stats.event(`visit/games-${playedSet.size >= 5 ? '5plus' : playedSet.size}`, 'games played in the visit');
  }
  addEventListener('pagehide', () => { adEnd(); gameEnd(); visitEnd(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { adEnd(); gameEnd(); visitEnd(); } else if (!inGame && started) adStart(cur); });

  // only the centred tile's ad plays; the rest pause and rewind
  function focusTile(i) {
    cur = i;
    [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));
    vids.forEach((v, j) => {
      if (j !== i) { v.pause(); v.currentTime = 0; return; }
      if (!started) return;
      if (adI !== i) adStart(i);
      playing = i;
      v.muted = !sound;
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); // browser blocked sound until a gesture: play silent for now, the next touch unmutes
    });
  }
  const io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting && e.intersectionRatio > .6) { const i = +e.target.dataset.i; if (i !== cur) beep(660); focusTile(i); }
  }, { root: rail, threshold: [.6] });
  tiles.forEach(t => io.observe(t));
  function go(i) { i = Math.max(0, Math.min(tiles.length - 1, i)); rail.scrollTo({ left: i * rail.clientWidth, behavior: 'smooth' }); }
  let splashEnd = -1e9;
  // games open in a frame over the catalog: the page never reloads, so the tap that turned the sound on still counts when you come back
  const frame = document.getElementById('play');
  let inGame = false;
  function launch(i) {
    if (!splashDone || performance.now() - splashEnd < 700) return;
    beep(990, .12); vids.forEach(v => v.pause());
    adEnd(true); Stats.event(`play/${slug(i)}`, `${games[i].name}: tapped play`); playedSet.add(i); gameI = i; gameT0 = performance.now();
    inGame = true; frame.src = games[i].href; frame.classList.add('on'); setTimeout(() => frame.focus(), 50);
  }
  function closeGame() { if (!inGame) return; gameEnd(); inGame = false; frame.classList.remove('on'); frame.src = 'about:blank'; window.focus(); focusTile(cur); }
  window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.disc === 'back') closeGame();
    else if (e.data.disc === 'track' && gameI >= 0 && /^[\w-]{1,40}$/.test(e.data.name)) Stats.event(`game/${slug(gameI)}/${e.data.name}`, `${games[gameI].name}: ${e.data.name}`);
  });
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);

  const sndBtn = document.getElementById('snd');
  function paintSound() { sndBtn.textContent = sound ? '🔊 SOUND' : '🔇 SOUND'; }
  sndBtn.onclick = () => { sound = !sound; paintSound(); Stats.event(`sound/${sound ? 'on' : 'off'}`, 'sound toggled'); vids[cur].muted = !sound; if (sound) vids[cur].play().catch(() => {}); };

  // ---------- splash: STUDIO, then a stray P lands and makes it STUPIDO ----------
  const splash = document.getElementById('splash'), word = document.getElementById('word');
  const letters = 'STUDIO'.split('').map((c, i) => { const s = document.createElement('span'); s.textContent = c; s.style.animationDelay = (.6 + i * .08) + 's'; word.appendChild(s); return s; });
  const P = document.createElement('span'); P.className = 'p'; P.textContent = 'P'; word.appendChild(P);
  word.style.width = '7em';
  const place = (el, slot) => { el.style.left = slot + 'em'; el.style.position = 'absolute'; };
  // STUDIO centred in 7 slots, then S T U P I D O
  letters.forEach((s, i) => place(s, i + .5));
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  let splashDone = false, gagDone = false;
  at(1300, () => beep(880, .25, 'triangle', .06));
  at(2300, () => { P.style.transition = 'transform .45s cubic-bezier(.55,0,1,.45)'; place(P, 3.5); P.style.transform = 'translateY(0)'; beep(220, .3, 'sawtooth', .03); });
  at(2750, () => {
    beep(90, .2, 'square', .09); word.classList.add('bump');
    // S T U | P | I D O  (D and I trade places as the P shoves in)
    const slots = { 0: 0, 1: 1, 2: 2, 3: 5, 4: 4, 5: 6 };
    letters.forEach((s, i) => { s.style.transition = 'left .25s cubic-bezier(.3,1.6,.5,1)'; place(s, slots[i]); });
    P.style.transition = 'left .25s'; place(P, 3);
  });
  at(3300, () => { document.getElementById('tm').style.opacity = 1; gagDone = true; });
  at(3800, () => document.getElementById('tap').classList.add('on'));
  function endSplash() {
    if (splashDone) return; splashDone = true; splashEnd = performance.now(); timers.forEach(clearTimeout);
    splash.classList.add('gone'); started = true; Stats.event('start', 'opened the disc'); sound = true; paintSound(); beep(990, .1);
    focusTile(cur); setTimeout(() => splash.remove(), 600);
  }
  // the tap that ends the splash is the gesture that lets the ad play with sound; it must not fall through to a tile
  splash.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); endSplash(); });
  // any first touch, click or key brings the sound in if the browser held it back
  const wake = () => { if (sound && splashDone) { const v = vids[cur]; v.muted = false; v.play().catch(() => {}); } };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));

  // ---------- keys + gamepad ----------
  window.addEventListener('keydown', e => {
    if (inGame) return;
    if (!splashDone) { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') endSplash(); return; }
    if (e.key === 'ArrowRight') { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go(cur - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { launch(cur); e.preventDefault(); }
  });
  let prev = {}, stickT = 0;
  (function poll(t) {
    for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) {
      if (!p || inGame) continue;
      const press = (i, fn) => { const d = !!(p.buttons[i] && p.buttons[i].pressed); if (d && !prev[i]) fn(); prev[i] = d; };
      if (!splashDone) { press(0, endSplash); press(9, endSplash); continue; }
      press(14, () => go(cur - 1)); press(15, () => go(cur + 1)); press(0, () => launch(cur)); press(9, () => launch(cur));
      const ax = p.axes[0] || 0; if (Math.abs(ax) > .6 && t - stickT > 260) { go(cur + (ax > 0 ? 1 : -1)); stickT = t; }
    }
    requestAnimationFrame(poll);
  })(0);

  focusTile(0);
  window.__menu = {
    entries: games.flatMap(g => [{ href: g.href }, { href: g.trailer }]),
    stats: () => Stats.sent.map(e => e.path),
    go, get cur() { return cur; }, get game() { return inGame ? frame.getAttribute('src') : null; }, closeGame, get playing() { return playing; }, endSplash, get gagDone() { return gagDone; },
    word: () => [...word.children].sort((a, b) => parseFloat(a.style.left) - parseFloat(b.style.left)).map(s => s.textContent).join(''),
  };
})();
</script>
</body></html>
